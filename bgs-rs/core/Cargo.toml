bgs-execpolicy = { workspace = true }
bgs-git-utils = { workspace = true }
bgs-guardian-context = { workspace = true }
bgs-guardian-reviewer = { workspace = true }
bgs-history = { workspace = true }
bgs-hooks = { workspace = true }
bgs-http-client = { workspace = true }
bgs-install-context = { workspace = true }
bgs-network-proxy = { workspace = true }
bgs-otel = { workspace = true }
bgs-plugin = { workspace = true }
bgs-model-provider = { workspace = true }
bgs-protocol = { workspace = true }
bgs-response-debug-context = { workspace = true }
bgs-prompts = { workspace = true }
bgs-rollout = { workspace = true }
bgs-rollout-trace = { workspace = true }
bgs-rmcp-client = { workspace = true }
bgs-sandboxing = { workspace = true }
bgs-skills = { workspace = true }
