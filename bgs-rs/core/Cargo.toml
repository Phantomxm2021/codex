bgs-agent-message-board-client = { workspace = true }
bgs-terminal-detection = { workspace = true }
bgs-thread-store = { workspace = true }
bgs-tools = { workspace = true }
bgs-utils-absolute-path = { workspace = true }
bgs-utils-audio = { workspace = true }
bgs-utils-cache = { workspace = true }
bgs-utils-git-discovery = { workspace = true }
bgs-utils-image = { workspace = true }
bgs-utils-home-dir = { workspace = true }
bgs-utils-output-truncation = { workspace = true }
bgs-utils-path = { workspace = true }
bgs-utils-path-uri = { workspace = true }
bgs-utils-plugins = { workspace = true }
