bgs-context-fragments = { workspace = true }
bgs-config = { workspace = true }
bgs-core-plugins = { workspace = true }
bgs-diagnostics = { workspace = true }
bgs-exec-server = { workspace = true }
bgs-extension-api = { workspace = true }
bgs-extension-items = { workspace = true }
bgs-features = { workspace = true }
bgs-feedback = { workspace = true }
bgs-file-system = { workspace = true }
bgs-login = { workspace = true }
