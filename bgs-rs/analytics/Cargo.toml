[package]
edition.workspace = true
license.workspace = true
name = "bgs-analytics"
version.workspace = true

[lib]
doctest = false
name = "bgs_analytics"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
bgs-http-client = { workspace = true }
bgs-app-server-protocol = { workspace = true }
bgs-git-utils = { workspace = true }
bgs-login = { workspace = true }
bgs-model-provider = { workspace = true }
bgs-plugin = { workspace = true }
bgs-protocol = { workspace = true }
bgs-state = { workspace = true }
bgs-utils-path-uri = { workspace = true }
os_info = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
bgs-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
