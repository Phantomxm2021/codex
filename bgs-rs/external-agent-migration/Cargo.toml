[package]
name = "bgs-external-agent-migration"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false
name = "bgs_external_agent_migration"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
bgs-analytics = { workspace = true }
bgs-config = { workspace = true }
bgs-core = { workspace = true }
bgs-core-plugins = { workspace = true }
bgs-hooks = { workspace = true }
bgs-login = { workspace = true }
bgs-memories-write = { workspace = true }
bgs-otel = { workspace = true }
bgs-plugin = { workspace = true }
bgs-protocol = { workspace = true }
bgs-rollout = { workspace = true }
bgs-thread-store = { workspace = true }
bgs-utils-output-truncation = { workspace = true }
linkify = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
bgs-app-server-protocol = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
