[package]
edition.workspace = true
license.workspace = true
name = "bgs-memories-write"
version.workspace = true

[lib]
name = "bgs_memories_write"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
bgs-backend-client = { workspace = true }
bgs-core = { workspace = true }
bgs-config = { workspace = true }
bgs-features = { workspace = true }
bgs-git-utils = { workspace = true }
bgs-login = { workspace = true }
bgs-model-provider = { workspace = true }
bgs-otel = { workspace = true }
bgs-protocol = { workspace = true }
bgs-rollout = { workspace = true }
bgs-rollout-trace = { workspace = true }
bgs-secrets = { workspace = true }
bgs-state = { workspace = true }
bgs-terminal-detection = { workspace = true }
bgs-utils-absolute-path = { workspace = true }
bgs-utils-output-truncation = { workspace = true }
bgs-utils-template = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }
uuid = { workspace = true, features = ["v4", "v5"] }

[dev-dependencies]
bgs-model-provider-info = { workspace = true }
bgs-models-manager = { workspace = true }
core_test_support = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
wiremock = { workspace = true }
