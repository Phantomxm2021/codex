[package]
edition.workspace = true
license.workspace = true
name = "bgs-hooks"
version.workspace = true

[lib]
doctest = false
name = "bgs_hooks"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
bgs-utils-process = { workspace = true }
anyhow = { workspace = true }
async-channel = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
bgs-config = { workspace = true }
bgs-plugin = { workspace = true }
bgs-protocol = { workspace = true }
bgs-utils-absolute-path = { workspace = true }
bgs-utils-output-truncation = { workspace = true }
bgs-utils-path-uri = { workspace = true }
futures = { workspace = true, features = ["alloc"] }
regex = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "process", "sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
libc = { workspace = true }
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(any(unix, windows))'.dependencies]
bgs-utils-pty = { workspace = true }
