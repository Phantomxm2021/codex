bgs-rollout = { workspace = true }
bgs-sandboxing = { workspace = true }
bgs-state = { workspace = true }
bgs-thread-store = { workspace = true }
bgs-tools = { workspace = true }
bgs-utils-absolute-path = { workspace = true }
bgs-utils-json-to-toml = { workspace = true }
bgs-utils-path-uri = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
