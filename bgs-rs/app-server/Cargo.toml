[package]
name = "bgs-app-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bgs-app-server"
path = "src/main.rs"

[[bin]]
name = "bgs-app-server-test-notify-capture"
path = "src/bin/notify_capture.rs"

[[bin]]
name = "exec-server"
path = "src/bin/exec_server.rs"

[lib]
name = "bgs_app_server"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
bgs-utils-process = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true, default-features = false, features = [
    "http1",
    "json",
    "tokio",
    "ws",
] }
bgs-analytics = { workspace = true }
bgs-agent-extension = { workspace = true }
bgs-arg0 = { workspace = true }
bgs-aws-auth = { workspace = true }
bgs-cloud-config = { workspace = true }
bgs-code-mode = { workspace = true }
bgs-config = { workspace = true }
bgs-network-proxy = { workspace = true }
bgs-connectors = { workspace = true }
bgs-core = { workspace = true }
bgs-core-plugins = { workspace = true }
bgs-diagnostics = { workspace = true }
bgs-home = { workspace = true }
bgs-exec-server = { workspace = true }
bgs-extension-api = { workspace = true }
bgs-external-agent-migration = { workspace = true }
bgs-features = { workspace = true }
bgs-goal-extension = { workspace = true }
bgs-git-attribution = { workspace = true }
bgs-guardian-v2 = { workspace = true }
bgs-git-utils = { workspace = true }
bgs-file-watcher = { workspace = true }
bgs-hooks = { workspace = true }
bgs-history-notes-extension = { workspace = true }
bgs-http-client = { workspace = true }
bgs-otel = { workspace = true }
bgs-plugin = { workspace = true }
bgs-shell-command = { workspace = true }
bgs-skills = { workspace = true }
bgs-skills-extension = { workspace = true }
bgs-utils-cli = { workspace = true }
bgs-user-verification = { workspace = true }
bgs-utils-pty = { workspace = true }
bgs-backend-client = { workspace = true }
bgs-file-search = { workspace = true }
bgs-chatgpt = { workspace = true }
bgs-login = { workspace = true }
bgs-image-generation-extension = { workspace = true }
bgs-memories-extension = { workspace = true }
bgs-web-search-extension = { workspace = true }
bgs-websocket-auth = { workspace = true }
bgs-memories-write = { workspace = true }
bgs-mcp = { workspace = true }
bgs-mcp-extension = { workspace = true }
bgs-model-provider = { workspace = true }
bgs-model-provider-info = { workspace = true }
