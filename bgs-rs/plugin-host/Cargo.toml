[package]
name = "bgs-plugin-host"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false
test = false

[[bin]]
name = "bgs-plugin-test-helper"
path = "tests/fixtures/plugin_process.rs"
test = false
bench = false
doc = false

[[test]]
name = "process"
path = "tests/process.rs"

[lints]
workspace = true

[dependencies]
futures = { workspace = true, features = ["executor", "std"] }
tokio-util = { workspace = true, features = ["codec", "compat", "rt"] }
bgs-utils-process = { workspace = true }
bgs-utils-pty = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
bgs-utils-cargo-bin = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
