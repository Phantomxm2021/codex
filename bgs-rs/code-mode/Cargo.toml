[package]
edition.workspace = true
license.workspace = true
name = "bgs-code-mode"
version.workspace = true

[lib]
doctest = false
name = "bgs_code_mode"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
bgs-code-mode-protocol = { workspace = true }
bgs-http-client = { workspace = true }
bgs-install-context = { workspace = true }
bgs-otel = { workspace = true }
bgs-protocol = { workspace = true }
futures = { workspace = true }
http-body-util = "0.1.3"
prost = "0.14.3"
rand = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tonic = { workspace = true, features = ["zstd"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
